name: Production smoke check

on:
  schedule:
    - cron: '15 2,14 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node backEnd/scripts/smoke.mjs
